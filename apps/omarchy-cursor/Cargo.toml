[package]
name = "omarchy-cursor"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A native cursor highlighter and magnifier for Omarchy / Hyprland"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
fs2 = "0.4"
ksni = { version = "0.3", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = { version = "=0.20.0", default-features = false, features = ["calloop"] }
tiny-skia = "0.11"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[profile.release]
opt-level = 2
strip = true
